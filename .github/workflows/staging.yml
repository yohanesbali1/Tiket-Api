name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run tests
        run: go test -race -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build binary
        run: go build -o queue-api ./cmd/server

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs:
      - build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging

    runs-on:
      - self-hosted
      - linux
      - staging

    needs:
      - docker

    environment:
      name: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Check server
        run: |
          set -e

          echo "================================"
          echo "Staging Deployment"
          echo "================================"

          echo "Runner : $(hostname)"
          echo "User   : $(whoami)"
          echo "Project: /home/yohanesdev/tiketapi"

          test -d /home/yohanesdev/tiketapi

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Docker Compose:"
          docker compose version

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -e

          cd /home/yohanesdev/tiketapi

          echo "================================"
          echo "Deploying"
          echo "================================"

          echo "Image: ${IMAGE_REPO}:${IMAGE_TAG}"

          echo ""
          echo "Login to GHCR..."

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin

          export IMAGE_REPO
          export IMAGE_TAG

          echo ""
          echo "Pulling Docker image..."

          docker compose pull

          echo ""
          echo "Starting containers..."

          docker compose up -d --remove-orphans

          echo ""
          echo "Container status:"

          docker compose ps

          echo ""
          echo "Waiting for application..."

          sleep 5

          echo ""
          echo "Checking health..."

          curl --fail --silent --show-error \
            http://localhost:8080/health

          echo ""
          echo "================================"
          echo "Deploy OK"
          echo "================================"
