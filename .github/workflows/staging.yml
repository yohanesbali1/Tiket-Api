name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Test
        run: go test -race -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build -o queue-api ./cmd/server

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy Docker
    runs-on:
      - self-hosted
      - linux
      - staging

    needs: docker

    environment:
      name: staging

    permissions:
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -e

          echo "Repository:"
          pwd

          echo "Checking docker-compose.yml:"
          test -f docker-compose.yml

          echo "Checking server .env:"
          test -f /home/yohanesdev/tiketapi/.env

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin

          export IMAGE_REPO
          export IMAGE_TAG

          echo "Deploying:"
          echo "ghcr.io/${IMAGE_REPO}:${IMAGE_TAG}"

          docker compose --env-file /home/yohanesdev/tiketapi/.env pull

          docker compose \
            --env-file /home/yohanesdev/tiketapi/.env \
            up -d --remove-orphans

          echo ""
          echo "Container status:"
          docker compose \
            --env-file /home/yohanesdev/tiketapi/.env \
            ps

          sleep 5

          echo ""
          echo "Health check:"

          curl --fail --silent --show-error \
            http://localhost:8080/health

          echo ""
          echo "Deploy OK"
