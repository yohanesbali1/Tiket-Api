deploy:
  name: Deploy to Production

  runs-on:
    - self-hosted
    - linux
    - production

  needs:
    - docker

  environment:
    name: production

  permissions:
    contents: read
    packages: read

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check server
      run: |
        set -e

        echo "Runner: $(hostname)"
        echo "Docker: $(docker --version)"
        echo "Compose: $(docker compose version)"

        docker info > /dev/null

    - name: Deploy
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        IMAGE_REPO: ghcr.io/${{ github.repository }}
        IMAGE_TAG: ${{ github.ref_name }}

        ENV_FILE: /home/yohanesdev/tiketapi/.env

      run: |
        set -e

        test -f docker-compose.yml
        test -f "$ENV_FILE"

        echo "========================================"
        echo "PRODUCTION DEPLOY"
        echo "========================================"

        echo "Image:"
        echo "${IMAGE_REPO}:${IMAGE_TAG}"

        echo "Tag:"
        echo "${IMAGE_TAG}"

        echo "$GHCR_TOKEN" | docker login ghcr.io \
          --username "$GHCR_USER" \
          --password-stdin

        export IMAGE_REPO
        export IMAGE_TAG
        export ENV_FILE

        echo ""
        echo "Validating Docker Compose..."

        docker compose \
          --env-file "$ENV_FILE" \
          config -q

        echo "Compose configuration OK"

        echo ""
        echo "Pulling image..."

        docker compose \
          --env-file "$ENV_FILE" \
          pull

        echo ""
        echo "Starting containers..."

        docker compose \
          --env-file "$ENV_FILE" \
          up -d --remove-orphans

        echo ""
        echo "Container status:"

        docker compose \
          --env-file "$ENV_FILE" \
          ps

        echo ""
        echo "Waiting for application..."

        sleep 5

        echo ""
        echo "Health check..."

        curl --fail --silent --show-error \
          http://localhost:8080/health

        echo ""
        echo "========================================"
        echo "PRODUCTION DEPLOY OK"
        echo "========================================"
