services:
  redis:
    image: redis:8-alpine
    container_name: tiket-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    image: ghcr.io/${IMAGE_REPO}:${IMAGE_TAG}
    container_name: tiket-api
    env_file:
      - /home/yohanesdev/tiketapi/.env
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
